name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Disposable CI service container. The test bootstrap refuses it if it already holds
      # any database it did not create, and creates one owned database per xdist worker.
      # MONGO_URL / DB_NAME are deliberately NOT set: tests refuse caller-supplied values.
      SIGNGUY_TEST_MONGO_URL: mongodb://localhost:27017
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Install private pricing engine
        env:
          PRICING_ENGINE_READ_TOKEN: ${{ secrets.PRICING_ENGINE_READ_TOKEN }}
        run: python backend/scripts/install_pricing_engine.py
      - name: Run backend test suite
        run: python -m pytest backend/tests/ -q

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend dependencies (frozen lockfile)
        run: yarn install --frozen-lockfile
      - name: Run frontend test suite
        run: CI=true yarn test --watchAll=false

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend dependencies (frozen lockfile, clean environment)
        run: yarn install --frozen-lockfile
      - name: Production build
        env:
          CI: "true"
          GENERATE_SOURCEMAP: "false"
          REACT_APP_API_BASE_URL: "/api"
        run: yarn build
