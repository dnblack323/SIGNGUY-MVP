<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SignGuy AI Dev Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        align-items: center;
        background: #eef8fb;
        color: #111827;
        display: grid;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }

      main {
        background: white;
        border: 1px solid #dbe3ea;
        border-radius: 12px;
        box-shadow: 0 18px 50px rgb(15 23 42 / 0.12);
        margin: auto;
        max-width: 420px;
        padding: 28px;
        text-align: center;
      }

      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }

      p {
        color: #4b5563;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Signing in to SignGuy AI</h1>
      <p id="status">Preparing Dev Shop session...</p>
    </main>
    <script>
      (async function devLogin() {
        const status = document.getElementById("status");
        const isLocal =
          window.location.hostname === "localhost" ||
          window.location.hostname === "127.0.0.1";

        if (!isLocal) {
          status.textContent = "Dev login is only available on localhost.";
          return;
        }

        try {
          const params = new URLSearchParams(window.location.search);
          const response = await fetch("/api/auth/dev-login", { method: "POST" });
          if (!response.ok) {
            throw new Error("Dev login failed with status " + response.status);
          }
          const data = await response.json();
          window.localStorage.setItem("signguy.token", data.access_token);
          window.sessionStorage.removeItem("signguy.suspended");
          if (params.get("stay") === "1") {
            const stored = window.localStorage.getItem("signguy.token");
            if (!stored) {
              status.textContent = "Dev token did not store.";
              return;
            }
            const me = await fetch("/api/auth/me", {
              headers: { Authorization: "Bearer " + stored },
            });
            status.textContent = me.ok
              ? "Dev token stored and verified."
              : "Dev token stored but /auth/me returned " + me.status + ".";
            return;
          }
          window.location.replace(params.get("next") || "/orders");
        } catch (error) {
          status.textContent = error.message || "Dev login failed.";
        }
      })();
    </script>
  </body>
</html>
